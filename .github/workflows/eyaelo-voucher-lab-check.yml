name: Eyaelo isolated voucher lab checks
on:
  pull_request:
    paths:
      - "eyaelo-voucher-lab/worker/**"
      - ".github/workflows/eyaelo-voucher-lab-check.yml"
  push:
    branches:
      - feature/eyaelo-isolated-voucher-lab
    paths:
      - "eyaelo-voucher-lab/worker/**"
      - ".github/workflows/eyaelo-voucher-lab-check.yml"
jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: eyaelo-voucher-lab/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
